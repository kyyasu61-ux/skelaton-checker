<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Checker — Validator Cookie Roblox</title>
    <style>
        :root {
            --bg-dark: #0a0b0d;
            --panel-bg: #111317;
            --accent-red: #ff3b30;
            --accent-green: #34c759;
            --border-color: #22252a;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Tampilan Awal: Loading Screen Sesuai Aslinya */
        #loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-red);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* Container Aplikasi Utama (Disembunyikan saat Loading) */
        #app-content {
            display: none;
            width: 100%;
            max-width: 480px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent-red);
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .input-area {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            height: 140px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #4ade80; /* Warna khas teks cookie */
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.8rem;
            padding: 12px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-red);
        }

        textarea::placeholder {
            color: #3a3d45;
        }

        button {
            width: 100%;
            background-color: var(--accent-red);
            color: var(--text-main);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:hover {
            background-color: #e03228;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Box Status Hasil Pengecekan */
        .status-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
            border: 1px solid transparent;
        }

        .status-box.checking {
            display: block;
            background-color: rgba(255, 255, 255, 0.03);
            border-color: var(--border-color);
            color: var(--text-muted);
            text-align: center;
        }

        .status-box.valid {
            display: block;
            background-color: rgba(52, 199, 89, 0.1);
            border-color: rgba(52, 199, 89, 0.3);
            color: #72f18a;
        }

        .status-box.invalid {
            display: block;
            background-color: rgba(255, 59, 48, 0.1);
            border-color: rgba(255, 59, 48, 0.3);
            color: #ff6b63;
        }

        .info-row {
            margin-top: 8px;
            font-family: monospace;
            background: rgba(0,0,0,0.2);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Bagian 1: Efek Memuat Persis Aslinya -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loading-text">Memuat Ghost Checker...</div>
    </div>

    <!-- Bagian 2: Tampilan Utama Tool -->
    <div id="app-content">
        <div class="header">
            <div class="logo">Ghost <span>Checker</span></div>
            <div class="tagline">Roblox Cookie Validator & Account Status</div>
        </div>

        <div class="input-area">
            <label for="cookieInput">Masukkan Cookie Roblox (_|WARNING:-...)</label>
            <textarea id="cookieInput" placeholder="Tempel kode cookie lengkap di sini..."></textarea>
        </div>

        <button id="btnCheck" onclick="runValidator()">Periksa Validitas</button>

        <div id="statusResult" class="status-box"></div>
    </div>

    <script>
        // Simulasi inisialisasi loading screen bawaan web asli selama 1.5 detik
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
            }, 1500);
        });

        async function runValidator() {
            const inputData = document.getElementById('cookieInput').value.trim();
            const resultBox = document.getElementById('statusResult');
            const btn = document.getElementById('btnCheck');

            if (!inputData) {
                alert('Kolom cookie tidak boleh kosong!');
                return;
            }

            // Set ke mode loading
            btn.disabled = true;
            resultBox.className = 'status-box checking';
            resultBox.innerHTML = '⏳ Menghubungkan ke API server Roblox...';

            try {
                // Menggunakan API Bridge agar terhindar dari pemblokiran CORS browser HP
                const targetUrl = encodeURIComponent('https://roblox.com');
                const response = await fetch(`https://allorigins.win{targetUrl}`, {
                    headers: { 'Cookie': `.ROBLOSECURITY=${inputData}` }
                });
                
                const data = await response.json();
                const robloxResponse = JSON.parse(data.contents);

                if (robloxResponse && robloxResponse.id) {
                    // Jika Cookie Valid
                    resultBox.className = 'status-box valid';
                    resultBox.innerHTML = `
                        <strong>🟢 STATUS: COOKIE VALID (AKTIF)</strong>
                        <div class="info-row">User ID: ${robloxResponse.id}</div>
                        <div class="info-row">Username: ${robloxResponse.name}</div>
                    `;
                } else {
                    // Jika Cookie Salah / Mati
                    resultBox.className = 'status-box invalid';
                    resultBox.innerHTML = `<strong>🔴 STATUS: COOKIE INVALID / EXPIRED</strong><br>Sesi login telah habis atau susunan kode salah.`;
                }
            } catch (err) {
                // Jika Koneksi Gagal
                resultBox.className = 'status-box invalid';
                resultBox.innerHTML = `<strong>⚠️ ERROR KONEKSI</strong><br>Gagal mengirim data ke server. Pastikan jaringan internet stabil.`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
